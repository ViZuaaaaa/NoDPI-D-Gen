name: 🐛 Проблема
title: '[Проблема] '
description: Сообщить о проблеме
labels: ['type: проблема', 'status: нуждается в сортировке']

body:
  - type: checkboxes
    id: checklist
    attributes:
      label: ⚠️ Чеклист
      description: Перед созданием нового Issue, удостоверьтесь что выполнили следующие пункты
      options:
        - label: Я искал решение проблемы в [README](https://github.com/ViZuaaaaa/NoDPI-D-Gen/blob/main/README.md) и среди [Issues](https://github.com/ViZuaaaaa/NoDPI-D-Gen/issues)
        - label: Я скачал ``DGen`` из [релизов официального репозитория](https://github.com/ViZuaaaaa/NoDPI-D-Gen/releases)

  - type: textarea
    id: description
    attributes:
      label: Опишите вашу проблему
      description: Чётко опишите проблему с которой вы столкнулись
      placeholder: Описание проблемы
    validations:
      required: true

  - type: textarea
    id: version
    attributes:
      label: Версия DGen
      description: Версия DGen на которой вы словили проблему
      placeholder: Версия
    validations:
      required: true

  - type: dropdown
    id: install_source
    attributes:
      label: Откуда вы скачали?
      description: |
        Важно: **GitHub "Code ZIP"** (исходники) обычно **не содержит** `bin/` и часто ломает запуск.
      options:
        - Release zip (из Releases)
        - GitHub Code ZIP (исходники)
        - Другое (опишу ниже)
    validations:
      required: true

  - type: dropdown
    id: link_type
    attributes:
      label: Тип подключения
      options:
        - Wi‑Fi
        - Ethernet (кабель)
        - Mobile hotspot / USB tethering
        - Другое (опишу ниже)
    validations:
      required: true

  - type: textarea
    id: report
    attributes:
      label: Отчёт (Report) / логи
      description: |
        1) Нажмите кнопку **Report** в лаунчере (в шапке окна).
        2) Сохраните `DGen-report-*.zip`.
        3) **Прикрепите zip к Issue** (перетащите файл в поле комментария).

        Если Report не получается — прикрепите вручную файлы из `D-Gen/logs/`:
        - `dgen-summary.json` (+ `.prev` если есть)
        - `engine.log` / `engine.log.prev`
        - `engine.stdout.log` / `engine.stdout.log.prev`
        - `dgen-launch.log` (лог лаунчера, если есть)
      placeholder: |
        Укажите имя отчёта (пример): DGen-report-20260127-112233.zip
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Шаги воспроизведения проблемы
      description: Шаги по воспроизведению поведения (вашей проблемы).
      placeholder: |
        Напишите здесь шаги, с помощью которых можно повторить вашу проблему
        на других компьютерах

  - type: textarea
    id: bat-name
    attributes:
      label: Какой .bat файл вы используете?
    validations:
      required: true

  - type: textarea
    id: other-bat
    attributes:
      label: Использовали ли вы другие .bat?
      description: Пробовали ли вы использовать другой .bat для устранения проблемы? Если использовали, то какие?

  - type: textarea
    id: additions
    attributes:
      label: Дополнительные детали
      description: Дополнительные детали о которых нам нужно знать
